# The GitHub Actions workflow overrides baseURL with the real Pages URL at build time.
baseURL = "https://example.github.io/"
locale = "en-us"
title = "Slop Factory"
enableRobotsTXT = true
summaryLength = 30

[params]
  tagline = "Artisanal slop. Hand-churned by robots. Served hot."
  description = "Slop Factory makes small, weird, free browser games and writes devlogs about every step. Now with 40% more slop."

[permalinks]
  blog = "/blog/:slug/"
  games = "/games/:slug/"

[taxonomies]
  tag = "tags"

[menus]
  [[menus.main]]
    name = "Our Games"
    pageRef = "/games"
    weight = 10
  [[menus.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 20
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 30

[markup.goldmark.renderer]
  unsafe = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
