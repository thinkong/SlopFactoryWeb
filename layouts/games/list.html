{{ define "main" }}
<section class="page-head">
  <h1 class="meme">{{ .Title }}</h1>
  {{- with .Params.description }}<p class="lede">{{ . }}</p>{{ end }}
</section>
<section class="section">
  <div class="grid games-grid">
    {{- range .Pages.ByDate.Reverse }}
    {{ partial "game-card.html" . }}
    {{- end }}
    <div class="card coming-soon">
      <p class="meme-sm">GAME #{{ add (len .Pages) 1 }}</p>
      <p>Currently bubbling in the vat. Follow the <a href="{{ "blog/" | relURL }}">blog</a> to watch it ooze into existence.</p>
    </div>
  </div>
</section>
{{ end }}
